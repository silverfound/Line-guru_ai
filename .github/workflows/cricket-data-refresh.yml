name: Refresh free cricket data

# Refresh four times per day; the script also enforces a 5h45m quota guard.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cricket-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch within free-tier request budget
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}
        run: node scripts/refresh-cricket-data.mjs

      - name: Publish refreshed feed
        run: |
          if git diff --quiet -- data/cricket-feed.json; then
            echo "Feed has no changes; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cricket-feed.json
          git commit -m "Refresh cricket match feed"
          git push
