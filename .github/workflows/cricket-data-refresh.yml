name: Refresh free cricket data

on:
  schedule:
    # Four scheduled runs per UTC day; offset from the hour to reduce schedule delays.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cricket-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch within free-tier request budget
        env:
          BIGBALLSDATA_API_KEY: ${{ secrets.BIGBALLSDATA_API_KEY }}
          OPENCRICKET_API_KEY: ${{ secrets.OPENCRICKET_API_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: node scripts/refresh-cricket-data.mjs

      - name: Commit public cricket feed if changed
        run: |
          if git diff --quiet -- data/cricket-feed.json; then
            echo "No feed changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cricket-feed.json
          git commit -m "Refresh automated cricket data feed"
          git push
