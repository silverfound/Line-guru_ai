name: Refresh free cricket data

# Automatic schedule intentionally disabled until the app is finalized.
# Keep workflow_dispatch for deliberate manual runs only.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cricket-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch within free-tier request budget
        env:
          BIGBALLSDATA_API_KEY: ${{ secrets.BIGBALLSDATA_API_KEY }}
          OPENCRICKET_API_KEY: ${{ secrets.OPENCRICKET_API_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: node scripts/refresh-cricket-data.mjs

      - name: Create a pull request for feed changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Refresh automated cricket data feed"
          title: "Refresh automated cricket data feed"
          body: "Automated cricket feed update. Review the data before merging."
          branch: "automation/cricket-data-feed"
          delete-branch: true
          add-paths: data/cricket-feed.json
