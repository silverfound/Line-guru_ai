name: Refresh free cricket data

# Manual-only refresh: do not consume provider quota on a schedule or push.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cricket-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch within free-tier request budget
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}
        run: node scripts/refresh-cricket-data.mjs

      - name: Write feed diagnostics to workflow summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          try {
            const feed = JSON.parse(await readFile("data/cricket-feed.json", "utf8"));
            const providers = Object.entries(feed.providers || {});
            const rows = providers.map(([name, p]) => `| ${name} | ${p.status || "unknown"} | ${p.rawMatchCount ?? p.matchCount ?? 0} | ${p.matchCount ?? (p.matches || []).length} | ${String(p.message || "—").replaceAll("|", "/")} |`).join("\n");
            const matches = feed.matches || [];
            const live = matches.filter(m => /live|in.?progress|1st inn|2nd inn|stumps/i.test(String(m.status || "") + " " + String(m.statusText || ""))).length;
            const finished = matches.filter(m => /won by|drawn|tied|abandoned|no result|cancelled|completed|finished|result:/i.test(String(m.status || "") + " " + String(m.statusText || ""))).length;
            const upcoming = matches.length - live - finished;
            const summary = `## Cricket feed refresh diagnostics\n\n- Generated at: ${feed.generatedAt || "unknown"}\n- Total matches: ${matches.length} (Live: ${live}, Upcoming/other: ${upcoming}, Finished: ${finished})\n\n| Provider | Status | Raw matches | Published matches | Message |\n|---|---:|---:|---:|---|\n${rows}\n`;
            await import("node:fs/promises").then(fs => fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary));
            console.log(summary);
          } catch (error) {
            const message = "Could not read feed diagnostics: " + String(error?.message || error);
            await import("node:fs/promises").then(fs => fs.appendFile(process.env.GITHUB_STEP_SUMMARY, message + "\n"));
            console.error(message);
          }
          NODE

      - name: Upload feed diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cricket-feed-diagnostics
          path: data/cricket-feed.json
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update feed pull request
        id: feed-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/cricket-feed-refresh
          delete-branch: true
          commit-message: "Refresh cricket match feed"
          title: "Refresh cricket match feed"
          body: |
            Automated cricket feed refresh from the configured free providers.
            Provider diagnostics and generated timestamp are included in the updated feed.

      - name: Merge feed update when repository rules allow
        if: steps.feed-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.feed-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch || {
            echo "Feed PR was created or updated, but repository rules require additional merge conditions."
            exit 0
          }
