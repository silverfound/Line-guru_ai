name: Model validation and Team-Aware training
on:
  push:
    branches: [main]
    paths: ["ml/**", "tests/**", ".github/workflows/model-validation.yml"]
  pull_request:
    branches: [main]
    paths: ["ml/**", "tests/**", ".github/workflows/model-validation.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pandas scikit-learn lightgbm joblib
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit prepared dataset split and feature leakage
        run: python ml/audit_dataset.py
  train-team-aware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install training dependencies
        run: python -m pip install --upgrade pip pandas scikit-learn lightgbm joblib
      - name: Download free Cricsheet historical match data
        run: |
          curl --fail --location --retry 3 https://cricsheet.org/downloads/all_json.zip --output all_json.zip
          test -s all_json.zip
      - name: Build leakage-safe pre-match dataset
        run: python ml/build_dataset.py --zip all_json.zip --out-dir ml/data
      - name: Train pre-match and post-toss Team-Aware models
        run: python ml/train_model.py --input ml/data/matches_with_features.csv --out-dir ml/output
      - name: Export browser model from this exact training run
        run: python ml/export_browser_model.py --model ml/output/team-aware-pre-match.joblib --output team-aware-predictor.js
      - name: Commit generated browser model to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-aware-predictor.js
          if ! git diff --cached --quiet; then
            git commit -m "Export Team-Aware model from validated training run"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload dataset summary, metrics and research models
        uses: actions/upload-artifact@v4
        with:
          name: team-aware-training-results
          path: |
            ml/data/dataset-summary.json
            ml/output/team-aware-metrics.json
            ml/output/*.joblib
          if-no-files-found: error
          retention-days: 30
