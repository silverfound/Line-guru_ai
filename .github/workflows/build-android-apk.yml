name: Build Line Guru AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-wrapper
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-guru-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download on GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Line Guru AI Android v1.0.1
          body: |
            Line Guru AI Android app with updated launcher icon.
            Download app-debug.apk below to install directly. No ZIP extraction required.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
