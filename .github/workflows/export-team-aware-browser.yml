name: Export Team-Aware browser model
on:
  pull_request:
    branches: [main]
    paths:
      - "ml/export_browser_model.py"
      - ".github/workflows/export-team-aware-browser.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download previously trained model artifact (no retraining)
        uses: actions/download-artifact@v4
        with:
          name: team-aware-training-results
          path: model-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 41075404674
      - name: Install model deserialization dependency
        run: python -m pip install joblib lightgbm scikit-learn pandas
      - name: Export browser model
        run: python ml/export_browser_model.py --model model-artifact/output/team-aware-pre-match.joblib --output team-aware-predictor.js
      - name: Commit generated browser model to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-aware-predictor.js
          if ! git diff --cached --quiet; then
            git commit -m "Export trained Team-Aware model for browser inference"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
