<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Match Prediction & Position Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cricket Match Prediction & Position Analysis</h2>
        
        <!-- Team 1 with Directory Datalist -->
        <div class="form-group">
            <label for="team1">Team 1 (Batting/First Team):</label>
            <input type="text" id="team1" list="teamsList" placeholder="نام لکھیں یا سلیکٹ کریں">
        </div>

        <!-- Captain 1 with Directory Datalist -->
        <div class="form-group">
            <label for="captain1">Team 1 Captain:</label>
            <input type="text" id="captain1" list="captainsList" placeholder="کپتان کا نام لکھیں یا سلیکٹ کریں">
        </div>

        <!-- Team 2 with Directory Datalist -->
        <div class="form-group">
            <label for="team2">Team 2 (Bowling/Second Team):</label>
            <input type="text" id="team2" list="teamsList" placeholder="نام لکھیں یا سلیکٹ کریں">
        </div>

        <!-- Captain 2 with Directory Datalist -->
        <div class="form-group">
            <label for="captain2">Team 2 Captain:</label>
            <input type="text" id="captain2" list="captainsList" placeholder="کپتان کا نام لکھیں یا سلیکٹ کریں">
        </div>

        <!-- Ground / Venue with Directory Datalist -->
        <div class="form-group">
            <label for="ground">Match Ground / Venue:</label>
            <input type="text" id="ground" list="venuesList" placeholder="گراؤنڈ کا نام لکھیں یا سلیکٹ کریں">
        </div>

        <!-- Venue Local Time Input -->
        <div class="form-group">
            <label for="matchTime">⏰ Venue Ka Local Date & Time:</label>
            <input type="datetime-local" id="matchTime">
            <small style="color: #94a3b8; font-size: 12px; display: block; margin-top: 4px;">Wahi waqt dalein jo match ke ground (Venue) ka local time hai.</small>
        </div>

        <!-- Lunar / Hijri Date Input Field -->
        <div class="form-group">
            <label for="lunarDate">🌙 Chand ki Qamri Tareekh (Auto/Editable):</label>
            <input type="number" id="lunarDate" min="1" max="30" value="15" placeholder="مثلاً: 14, 15, 16">
            <small style="color: #94a3b8; font-size: 12px; display: block; margin-top: 4px;">English tareekh se automatic aaye gi, zaroorat parne par khud badal sakte hain.</small>
        </div>

        <div class="form-group">
            <label for="tossWinner">Toss Winner:</label>
            <select id="tossWinner">
                <option value="captain1">Team 1 Captain</option>
                <option value="captain2">Team 2 Captain</option>
            </select>
        </div>

        <button onclick="calculatePrediction()">Calculate Sitaron Ka Hisab</button>

        <div id="resultBox" class="hidden" style="margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; border: 1px solid #334155;">
            <h3>Match Analysis & Result</h3>
            <div id="outputContent"></div>
        </div>
    </div>

    <!-- 📁 Name Directory Lists (Teams, Captains, Venues) -->
    <datalist id="teamsList">
        <option value="افغانستان">
        <option value="پاکستان">
        <option value="بھارت">
        <option value="آسٹریلیا">
        <option value="انگلینڈ">
        <option value="جنوبی افریقہ">
        <option value="نیوزی لینڈ">
        <option value="سری لنکا">
        <option value="بنگلا دیش">
        <option value="زمبابوی">
        <option value="ویسٹ انڈیز">
        <option value="آئرلینڈ">
    </datalist>

    <datalist id="captainsList">
        <option value="إبراھم زدران">
        <option value="راشد خان">
        <option value="بابر اعظم">
        <option value="محمد رضوان">
        <option value="روہت شرما">
        <option value="پ্যাট کمنز">
        <option value="جوس بٹلر">
        <option value="سکنر رضا">
        <option value="शाकिब अल हसन">
    </datalist>

    <datalist id="venuesList">
        <option value="شارجه">
        <option value="دبﯽ">
        <option value="ابوظہبی">
        <option value="لاہور">
        <option value="کراچی">
        <option value="راولپنڈی">
        <option value="ممبئی">
        <option value="کولکتہ">
        <option value="ملبورن">
        <option value="سڈنی">
        <option value="برمنگھم">
    </datalist>

    <script src="script.js"></script>
</body>
</html>
