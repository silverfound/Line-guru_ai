<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Prediction AI - Sitaron Ka Hisab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏏 Sitaron Ka Hisab</h1>
        <p class="subtitle">Cricket Match Prediction & Position Analysis</p>

        <div class="form-group">
            <label>Team 1 (Batting/First Team):</label>
            <input type="text" id="team1" placeholder="e.g. Afghanistan" value="Afghanistan">
        </div>

        <div class="form-group">
            <label>Team 1 Captain:</label>
            <input type="text" id="captain1" placeholder="e.g. Ibrahim Zadran" value="Ibrahim Zadran">
        </div>

        <div class="form-group">
            <label>Team 2 (Bowling/Second Team):</label>
            <input type="text" id="team2" placeholder="e.g. Zimbabwe" value="Zimbabwe">
        </div>

        <div class="form-group">
            <label>Team 2 Captain:</label>
            <input type="text" id="captain2" placeholder="e.g. Sikandar Raza" value="Sikandar Raza">
        </div>
                <div class="form-group">
            <label>Match Ground / Venue:</label>
            <input type="text" id="ground" placeholder="e.g. Sharjah" value="Sharjah">
                </div>
        
                <div class="form-group">
            <label>Match Date & Time:</label>
            <input type="datetime-local" id="matchTime">
                </div>
        
        <!-- Lunar / Hijri Date Input Field -->
<div class="input-group" style="margin-bottom: 15px;">
    <label for="lunarDate" style="display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 14px;">🌙 چاند کی قمری تاریخ (Auto/Editable):</label>
    <input type="number" id="lunarDate" min="1" max="30" value="15" style="width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px;" placeholder="مثلاً: 14, 15, 16">
    <small style="color: #94a3b8; font-size: 12px;">انگلش تاریخ سے آٹومیٹک آئے گی، ضرورت پڑنے پر آپ خود بھی بدل سکتے ہیں۔</small>
</div>
        
        <div class="form-group">
            <label>Toss Winner:</label>
            <select id="tossWinner">
                <option value="captain1">Team 1 Captain (Ibrahim Zadran)</option>
                <option value="captain2" selected>Team 2 Captain (Sikandar Raza)</option>
            </select>
        </div>

        <button onclick="calculatePrediction()">Calculate Sitaron Ka Hisab</button>

        <div id="resultBox" class="result-box hidden">
            <h2>Match Analysis & Result</h2>
            <div id="outputContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
