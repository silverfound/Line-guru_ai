<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علم الجفر کرکٹ پریڈکشن سسٹم</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Professional Nastaliq/Clean look -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <h1>🔮 کرکٹ جفری پریڈکشن سسٹم</h1>
            <p>ابجد-ع-کبیر، سیاروی ساعت اور بروج کی روشنی میں حتمی تجزیہ</p>
        </header>

        <!-- Main Form Card -->
        <main class="prediction-card">
            <div class="input-grid">
                
                <!-- Format Selection -->
                <div class="input-group full-width">
                    <label for="matchFormat">میچ کا فارمیٹ</label>
                    <select id="matchFormat" onchange="updateFormatCaptains()">
    <option value="t20">ٹی ٹوئنٹی اور لیگز میچ</option>
    <option value="odi">ایک روزہ میچ</option>
    <option value="test">ٹیسٹ میچ</option>
</select>

                </div>

                <!-- Team 1 Selection -->
                <div class="input-group">
                    <label for="team1Select">پہلی ٹیم منتخب کریں</label>
                    <select id="team1Select" onchange="onTeam1Change()">
                        <option value="">-- ٹیم چنیں --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="captain1">پہلی ٹیم کا کپتان</label>
                    <input type="text" id="captain1" placeholder="یا خود نام لکھیں">
                    <input type="hidden" id="team1">
                </div>

                <!-- Team 2 Selection -->
                <div class="input-group">
                    <label for="team2Select">دوسری ٹیم منتخب کریں</label>
                    <select id="team2Select" onchange="onTeam2Change()">
                        <option value="">-- ٹیم چنیں --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="captain2">دوسری ٹیم کا کپتان</label>
                    <input type="text" id="captain2" placeholder="یا خود نام لکھیں">
                    <input type="hidden" id="team2">
                </div>

                <!-- Match Details -->
                <div class="input-group">
                    <label for="ground">گراؤنڈ / شہر</label>
                    <input type="text" id="ground" placeholder="مثال: راولپنڈی">
                </div>

                <div class="input-group">
                    <label for="lunarDate">چاند کی تاریخ (قمری)</label>
                    <input type="number" id="lunarDate" min="1" max="30" value="15">
                </div>

                <div class="input-group full-width">
                    <label for="matchTime">میچ کی تاریخ اور وقت</label>
                    <input type="datetime-local" id="matchTime">
                </div>

                <!-- Toss Choice -->
                <div class="input-group full-width">
                    <label for="tossWinner">ٹاس جیتنے والی ٹیم منتخب کریں</label>
                    <select id="tossWinner">
                        <option value="captain1">پہلی ٹیم کا کپتان</option>
                        <option value="captain2">دوسری ٹیم کا کپتان</option>
                    </select>
                </div>
            </div>

            <!-- Action Button -->
            <button class="calculate-btn" onclick="startPredictionAnimation()">
                <span>نتیجہ اور تجزیہ دیکھیں</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </main>

        <!-- Loading Spinner (Hidden by default) -->
        <div id="loaderBox" class="loader-box hidden">
            <div class="spinner"></div>
            <p>ستاروں اور جفری اعداد کا حساب لگایا جا رہا ہے...</p>
        </div>

        <!-- Result Section -->
        <section id="resultBox" class="result-card hidden">
            <h2>✨ جفری و نجومی تجزیہ رپورٹ</h2>
            <div id="outputContent"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
