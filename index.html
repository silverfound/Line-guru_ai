<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Match Prediction & Position Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cricket Match Prediction & Position Analysis</h2>
        
        <div class="form-group">
            <label for="team1">Team 1:</label>
            <input type="text" id="team1" class="form-control" placeholder="Team 1 ka naam likhein">
        </div>

        <div class="form-group">
            <label for="captain1">Team 1 Captain:</label>
            <input type="text" id="captain1" class="form-control" placeholder="Captain ka naam likhein">
        </div>

        <div class="form-group">
            <label for="team2">Team 2:</label>
            <input type="text" id="team2" class="form-control" placeholder="Team 2 ka naam likhein">
        </div>

        <div class="form-group">
            <label for="captain2">Team 2 Captain:</label>
            <input type="text" id="captain2" class="form-control" placeholder="Captain ka naam likhein">
        </div>

        <div class="form-group">
            <label for="matchFormat">Match Format (میچ کا فارمیٹ):</label>
            <select id="matchFormat" class="form-control">
                <option value="t20">T20 Match</option>
                <option value="odi">ODI (One Day International)</option>
                <option value="test">Test Match</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ground">Match Ground / Venue:</label>
            <input type="text" id="ground" class="form-control" placeholder="Ground ka naam likhein (Jaise Sharjah)">
        </div>

        <div class="form-group">
            <label for="matchTime">Venue Ka Local Date & Time ⏰:</label>
            <input type="datetime-local" id="matchTime" class="form-control">
            <small style="color: #94a3b8;">Wahi waqt dalein jo match ke ground (Venue) ka local time hai</small>
        </div>

        <div class="form-group">
            <label for="lunarDate">Chand ki Qamri Tareekh 🌙 (Auto/Editable):</label>
            <input type="number" id="lunarDate" class="form-control" value="15" min="1" max="29">
            <small style="color: #94a3b8;">English tareekh se automatic aayegi, zaroorat parne par khud badal sakte hain</small>
        </div>

        <div class="form-group">
            <label for="tossWinner">Toss Winner:</label>
            <select id="tossWinner" class="form-control">
                <option value="captain1">Team 1 Captain</option>
                <option value="captain2">Team 2 Captain</option>
            </select>
        </div>

        <button onclick="calculatePrediction()" class="btn-calculate">Calculate Sitaron Ka Hisab</button>

        <div id="resultBox" class="result-box hidden">
            <h3>Natija wa Tajziya (Prediction Analysis)</h3>
            <div id="outputContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
